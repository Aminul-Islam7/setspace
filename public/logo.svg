<svg xmlns="http://www.w3.org/2000/svg" viewBox="81 56 350 400" width="350" height="400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SetSpace logo</title>

  <!-- Outer cube silhouette (black, rounded corners) -->
  <polygon points="256,68 418.8,162 418.8,350 256,444 93.2,350 93.2,162"
           fill="#1B1512" stroke="#1B1512" stroke-width="24" stroke-linejoin="round"/>

  <!-- TOP FACE (off-white) + black play icon -->
  <polygon points="256,79.9 396.5,161 256,242.1 115.5,161"
           fill="#FFF9F6" stroke="#FFF9F6" stroke-width="12" stroke-linejoin="round"/>
  <g transform="matrix(0.866 -0.5 0.866 0.5 256 161)">
    <polygon points="-26,-40 -26,40 42,0"
             fill="#1B1512" stroke="#1B1512" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- LEFT FACE (white) + black music wave bars -->
  <polygon points="103.5,181.8 244,262.9 244,425.2 103.5,344.1"
           fill="#FFF9F6" stroke="#FFF9F6" stroke-width="12" stroke-linejoin="round"/>
  <g transform="matrix(0.866 0.5 0 1 173.75 303.5)" fill="#FA6E16">
    <rect x="-58" y="-20" width="12" height="40"  rx="6"/>
    <rect x="-32" y="-42" width="12" height="84"  rx="6"/>
    <rect x="-6"  y="-60" width="12" height="120" rx="6"/>
    <rect x="20"  y="-35" width="12" height="70"  rx="6"/>
    <rect x="46"  y="-18" width="12" height="36"  rx="6"/>
  </g>

  <!-- RIGHT FACE (black, merges with silhouette) + white aperture icon -->
  <g transform="matrix(0.866 -0.5 0 1 338.25 303.5) scale(5.2) translate(-12 -12)"
     fill="none" stroke="#FFF9F6" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <line x1="14.31" y1="8"  x2="20.05" y2="17.94"/>
    <line x1="9.69"  y1="8"  x2="21.17" y2="8"/>
    <line x1="7.38"  y1="12" x2="13.12" y2="2.06"/>
    <line x1="9.69"  y1="16" x2="3.95"  y2="6.06"/>
    <line x1="14.31" y1="16" x2="2.83"  y2="16"/>
    <line x1="16.62" y1="12" x2="10.88" y2="21.94"/>
  </g>
</svg>
